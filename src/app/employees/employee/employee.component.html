<h1 class="display-4">
  EMP. Register
</h1>

<form #form="ngForm" autocomplete="off" (ngSubmit)="onSubmit(form)">

  <input type="hidden" name="id" #id="ngModel" [(ngModel)]="_employee.formData.id">

  <div class="form-group">
    <input name="fullName" #fullName="ngModel" [(ngModel)]="_employee.formData.fullName" class="form-control" placeholder="FullName" required>
    <div *ngIf="fullName.invalid && fullName.touched" class="validation-error">This field is required</div>
  </div>

  <div class="form-group">
    <input name="position" #position="ngModel" [(ngModel)]="_employee.formData.position" class="form-control" placeholder="Position" required>
    <div *ngIf="position.invalid && position.touched" class="validation-error">This field is required</div>
  </div>

  <div class="form-row">
    <div class="form-group col-md-6">
      <input name="empCode" #empCode="ngModel" [(ngModel)]="_employee.formData.empCode" class="form-control" placeholder="Emp. Code" required>
      <div *ngIf="empCode.invalid && empCode.touched" class="validation-error">This field is required</div>
    </div>

    <div class="form-group col-md-6">
      <input name="mobile" #mobile="ngModel" [(ngModel)]="_employee.formData.mobile" class="form-control" placeholder="Mobile" required>
      <div *ngIf="mobile.invalid && mobile.touched" class="validation-error">This field is required</div>
    </div>
  </div>

  <div class="form-group">
    <button type="submit" [disabled]="form.invalid" class="btn btn-lg btn-block btn-info">
      SUBMIT
    </button>
  </div>
</form>
